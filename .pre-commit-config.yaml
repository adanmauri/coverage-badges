# Local checks: the commit hook and `make lint` run this file. Install the hooks once with
# `make setup`. CI runs MegaLinter (.github/workflows/code-quality.yaml); the Python linters it
# runs are also here, so a commit that passes locally does not fail there.
# Python tool revs match uv.lock. Bump revs with `pre-commit autoupdate` (pick releases at
# least two weeks old).

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.11.0
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff-check

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: [--offline]
        # Only the published action for now; the workflows have findings to fix first (TODO.md).
        files: ^action\.yml$

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --locked pyright src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: uv run --locked pylint src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run --locked bandit -q -r src -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: check-agents
        name: agent pointers in sync with .agents/
        entry: uv run --no-project tooling/sync_agents.py --check
        language: system
        pass_filenames: false
        files: ^(\.agents/|\.claude/skills/|\.github/(skills|instructions)/|\.cursor/rules/|tooling/sync_agents\.py$)
      - id: check-docs
        name: docs links and ADR index
        entry: uv run --no-project tooling/check_docs.py
        language: system
        pass_filenames: false
        files: \.md$|^tooling/check_docs\.py$
      - id: no-tool-attribution
        name: no tool attribution in the commit message
        entry: uv run --no-project tooling/check_commit_msg.py
        language: system
        stages: [commit-msg]
