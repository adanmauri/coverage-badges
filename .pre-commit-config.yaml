# Local checks: the commit hook and `make lint` run this file. Install the hooks once with
# `make setup`; pre-commit installs the Go and Node.js runtimes the hooks need if they are missing.
# CI runs MegaLinter (.github/workflows/code-quality.yaml) with the same linters and settings
# (docs/adr/0007):
# - Python linters run from uv.lock, updated like any development dependency.
# - Node.js and Go linters pin the image's version in additional_dependencies, and betterleaks,
#   actionlint, shellcheck and zizmor keep it as their rev; check-linter-versions fails when they
#   drift.
# The scanners that need the network or a vulnerability database run only in CI. Bump the other
# revs with `pre-commit autoupdate` (pick releases at least two weeks old).

default_install_hook_types: [pre-commit, commit-msg]
# Hooks check staged files; only no-tool-attribution, which says so, reads the commit message.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.7.3
    hooks:
      - id: betterleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.0
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --locked black
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: isort
        name: isort
        entry: uv run --locked isort --filter-files
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: flake8
        name: flake8
        entry: uv run --locked flake8
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --locked pyright src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: uv run --locked pylint src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run --locked bandit -q -r src -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: uv run --locked yamllint --format standard -c .yamllint.yml
        language: system
        types: [yaml]
        exclude: ^tests/fixtures/
      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: golang
        additional_dependencies: [mvdan.cc/sh/v3/cmd/shfmt@v3.13.1]
        types: [shell]
      - id: prettier
        name: prettier (JSON and YAML)
        entry: prettier --write
        language: node
        additional_dependencies: [prettier@3.9.6]
        types_or: [json, yaml]
        exclude: ^tests/fixtures/
      - id: jsonlint
        name: jsonlint
        entry: jsonlint --quiet
        language: node
        additional_dependencies: ["@prantlf/jsonlint@17.0.1"]
        types: [json]
        exclude: ^tests/fixtures/
      - id: markdownlint
        name: markdownlint
        entry: markdownlint -c .markdownlint.json
        language: node
        additional_dependencies: [markdownlint-cli@0.49.1]
        types: [markdown]
      - id: markdown-table-formatter
        name: markdown-table-formatter
        entry: markdown-table-formatter
        language: node
        additional_dependencies: [markdown-table-formatter@1.7.0]
        types: [markdown]
      - id: cspell
        name: cspell
        entry: cspell --no-progress --no-summary --no-must-find-files --show-context
        language: node
        additional_dependencies: [cspell@10.1.1]
        types: [text]
        exclude: ^tests/fixtures/
      - id: secretlint
        name: secretlint
        entry: secretlint --secretlintrc .secretlintrc.json
        language: node
        additional_dependencies:
          - secretlint@13.0.5
          - "@secretlint/secretlint-rule-preset-recommend@13.0.5"
        types: [text]
        # secretlint skips its own config, and fails when that leaves it nothing to check.
        exclude: ^\.secretlintrc\.json$
      - id: jscpd
        name: jscpd (copied code)
        entry: jscpd --config .jscpd.json .
        language: node
        additional_dependencies: [jscpd@5.0.16]
        types: [text]
        pass_filenames: false
      - id: check-linter-versions
        name: linter versions match the MegaLinter image
        # Reads the image's Dockerfile from GitHub, so it runs only when a version can change.
        entry: uv run --no-project tooling/check_linter_versions.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/code-quality\.yaml|tooling/check_linter_versions\.py)$
      - id: check-agents
        name: agent pointers in sync with .agents/
        entry: uv run --no-project tooling/sync_agents.py --check
        language: system
        pass_filenames: false
        files: ^(\.agents/|\.claude/skills/|\.github/(skills|instructions)/|\.cursor/rules/|tooling/sync_agents\.py$)
      - id: check-docs
        name: docs links and ADR index
        entry: uv run --no-project tooling/check_docs.py
        language: system
        pass_filenames: false
        files: \.md$|^tooling/check_docs\.py$
      - id: no-tool-attribution
        name: no tool attribution in the commit message
        entry: uv run --no-project tooling/check_commit_msg.py
        language: system
        stages: [commit-msg]
