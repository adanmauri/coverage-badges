# Local checks: the commit hook and `make lint` run this file. Install the hooks once with
# `make setup`. CI runs MegaLinter (.github/workflows/code-quality.yaml) with the same linters at
# the same versions, so a commit that passes locally does not fail there (docs/adr/0007):
# - Python linters run from uv.lock, pinned in pyproject.toml.
# - actionlint, shellcheck and zizmor keep the rev of the version in the MegaLinter image.
# check-linter-versions fails when either side drifts. Bump the other revs with
# `pre-commit autoupdate` (pick releases at least two weeks old).

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.2
    hooks:
      - id: uv-lock

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.25.0
    hooks:
      - id: zizmor
        args: [--offline]

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --locked black
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: isort
        name: isort
        # Its own resolution: pylint, in the lint group, requires an older isort (pyproject.toml).
        entry: uv run --locked --isolated --no-default-groups --group isort isort --filter-files
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-check
        name: ruff
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: flake8
        name: flake8
        entry: uv run --locked flake8
        language: system
        types: [python]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run --locked mypy src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: pyright
        name: pyright
        entry: uv run --locked pyright src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: pylint
        name: pylint
        entry: uv run --locked pylint src tests tooling
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run --locked bandit -q -r src -c pyproject.toml
        language: system
        types: [python]
        pass_filenames: false
      - id: check-linter-versions
        name: linter versions match the MegaLinter image
        # Reads the image's Dockerfile from GitHub, so it runs only when a version can change.
        entry: uv run --no-project tooling/check_linter_versions.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/code-quality\.yaml|tooling/check_linter_versions\.py)$
      - id: check-agents
        name: agent pointers in sync with .agents/
        entry: uv run --no-project tooling/sync_agents.py --check
        language: system
        pass_filenames: false
        files: ^(\.agents/|\.claude/skills/|\.github/(skills|instructions)/|\.cursor/rules/|tooling/sync_agents\.py$)
      - id: check-docs
        name: docs links and ADR index
        entry: uv run --no-project tooling/check_docs.py
        language: system
        pass_filenames: false
        files: \.md$|^tooling/check_docs\.py$
      - id: no-tool-attribution
        name: no tool attribution in the commit message
        entry: uv run --no-project tooling/check_commit_msg.py
        language: system
        stages: [commit-msg]
