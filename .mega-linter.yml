# MegaLinter configuration for CI (.github/workflows/code-quality.yaml), and the config a local
# `mega-linter-runner --flavor python` picks up. Why MegaLinter runs in CI next to the local
# pre-commit hooks: docs/adr/0005-quality-gates-pre-commit-locally-megalinter-in-ci.md.
# https://megalinter.io/latest/config-file/

# Report, never push fixes from CI.
APPLY_FIXES: none

# Pull requests lint the files that differ from main; the workflow sets VALIDATE_ALL_CODEBASE
# per event (docs/adr/0008).
DEFAULT_BRANCH: main

# Every linter the Python flavor ships runs and blocks; those that find no files switch
# themselves off. A linter that does not fit this repository goes under DISABLE_LINTERS with the
# reason, instead of running without blocking: a finding that never fails CI is never fixed.

# The Python linters read the settings the local hooks read. Without these, MegaLinter falls back
# to its own default files when the repository has none by the name it looks for (a .pylintrc,
# a .ruff.toml with line-length 88...). black finds pyproject.toml and flake8 finds .flake8.
PYTHON_BANDIT_CONFIG_FILE: pyproject.toml
PYTHON_ISORT_CONFIG_FILE: pyproject.toml
PYTHON_MYPY_CONFIG_FILE: pyproject.toml
PYTHON_PYLINT_CONFIG_FILE: pyproject.toml
PYTHON_RUFF_CONFIG_FILE: pyproject.toml

# Bandit scans the code the action runs, as the local hook does; tests/ and tooling/ never ship.
PYTHON_BANDIT_FILTER_REGEX_INCLUDE: ^src/

# tests/fixtures/ holds coverage reports in the exact shape the tools write them, so formatting
# rules do not apply. The others are trees nobody writes by hand.
FILTER_REGEX_EXCLUDE: '(^tests/fixtures/|/\.venv/|^\.venv/|megalinter-reports/)'

# mypy, pylint and pyright resolve the imports in tests/ (pytest). Every Python linter has its
# own venv in the image, so the test group from uv.lock goes into the venvs of mypy and pylint,
# and into the system Python that pyright, a Node.js tool, inspects. The image ships uv.
PRE_COMMANDS:
  - command: >-
      uv export --frozen --no-hashes --no-emit-project --only-group test
      --output-file /tmp/requirements-test.txt
    cwd: workspace
    continue_if_failed: false
  - command: pip install --quiet -r /tmp/requirements-test.txt
    venv: mypy
    continue_if_failed: false
  - command: pip install --quiet -r /tmp/requirements-test.txt
    venv: pylint
    continue_if_failed: false
  - command: uv pip install --system --break-system-packages -r /tmp/requirements-test.txt
    cwd: workspace
    continue_if_failed: false
