[project]
name = "coverage-badges"
version = "1.0.0"
description = "GitHub Action that keeps a coverage badge up to date in private repositories."
readme = "README.md"
license = "MIT"
# The action runs on the runner's own python3, so the code supports 3.10+; development uses
# the version in .python-version.
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
test = ["pytest", "pytest-cov"]
lint = [
    "bandit",
    "black",
    "flake8",
    "isort",
    "mypy",
    "pylint",
    "pyright",
    "ruff",
    "yamllint",
]
dev = [{ include-group = "test" }, { include-group = "lint" }]

[tool.uv]
# Not an installable package: the action runs the sources from its checkout.
package = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint]
disable = ["W0718"]  # broad-exception-caught
max-line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
