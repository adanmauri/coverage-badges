---
# yamllint settings, read by the local hook and by MegaLinter (YAML_YAMLLINT). MegaLinter's own
# default, kept here so both read the same file (docs/adr/0007).
extends: default
rules:
  braces:
    max-spaces-inside: 1
  new-lines:
    level: warning
    type: unix
  line-length:
    max: 500
  comments:
    # The spacing prettier writes: https://github.com/prettier/prettier/pull/10926
    min-spaces-from-content: 1
