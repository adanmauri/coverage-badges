---
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # Releases at least two weeks old, as for the pre-commit revs.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    # The linters follow the MegaLinter image and move only when it does (docs/adr/0007).
    ignore:
      - dependency-name: "bandit"
      - dependency-name: "black"
      - dependency-name: "flake8"
      - dependency-name: "isort"
      - dependency-name: "mypy"
      - dependency-name: "pylint"
      - dependency-name: "pyright"
      - dependency-name: "ruff"

  # Actions are pinned to a commit; Dependabot moves the SHA and its version comment together.
  # A MegaLinter bump fails check_linter_versions.py until the lint pins in pyproject.toml and
  # .pre-commit-config.yaml match the new image.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
