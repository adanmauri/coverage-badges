---
name: Code Quality & Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run MegaLinter
        uses: oxsecurity/megalinter/flavors/python@v9.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEGALINTER_CACHE: "true"
          PYTHON_ISORT_CONFIG_FILE: pyproject.toml
          DISABLE_LINTERS: PYTHON_BANDIT
          PRE_COMMANDS: >
            [
              {
                "command": "pip install --root-user-action=ignore uv"
              },
              {
                "command": "uv export --frozen --no-hashes --no-emit-project --all-groups --output-file /tmp/requirements-dev.txt"
              },
              {
                "command": "uv pip install --system --break-system-packages -r /tmp/requirements-dev.txt"
              }
            ]
