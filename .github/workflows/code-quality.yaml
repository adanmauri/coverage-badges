---
name: Code Quality & Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests lint the files they change, found with `git diff origin/main...`,
          # which needs the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: Choose what to lint
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # Files that change what the linters report. A pull request touching one lints
          # everything, or a stricter rule would pass the pull request and fail main.
          LINT_SETTINGS: >-
            ^(\.mega-linter\.yml|\.pre-commit-config\.yaml|pyproject\.toml|\.flake8|\.cspell\.json|\.markdownlint\.json|\.yamllint\.yml|\.secretlintrc\.json|\.jscpd\.json|lychee\.toml|\.github/workflows/code-quality\.yaml)$
        # Pull requests lint what they change; main lints everything (docs/adr/0008).
        run: |
          all=true
          if [ "$EVENT_NAME" = pull_request ] &&
            ! git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE "$LINT_SETTINGS"; then
            all=false
          fi
          echo "Lint the whole codebase: $all"
          echo "all=$all" >> "$GITHUB_OUTPUT"

      - name: Run MegaLinter
        # The image the MegaLinter action runs, by digest: the action pinned by commit still pulled
        # it by tag. Dependabot does not update docker:// references; bump it by hand
        # (docs/CI.md). Linter settings live in .mega-linter.yml.
        uses: docker://ghcr.io/oxsecurity/megalinter-python:v10.1.0@sha256:f12a40b0dd5ad2c9aa029dcf7d3a0a92182d05cacc32d37756e67c3446484acb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: ${{ steps.scope.outputs.all }}
