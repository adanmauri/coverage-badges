---
name: Security & Vulnerability Analysis

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Trivy database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Run Trivy vulnerability scanner
        id: trivy-scan
        # Pinned to a commit: the 0.28.0 tag used here before was rewritten to malware in March
        # 2026 (docs/adr/0009).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          # The Trivy binary, pinned too: the attack also published a malicious Trivy release.
          version: "v0.70.0"
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          skip-dirs: |
            .git
            .github
            node_modules
            __pycache__
            .pytest_cache
            .mypy_cache
            .ruff_cache
            .ipynb_checkpoints

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        # Not on pull requests: those from forks and from Dependabot get a read-only token, and the
        # Security tab tracks main, which the push and the daily run cover.
        if: >-
          always() && github.event_name != 'pull_request' &&
          steps.trivy-scan.outcome != 'skipped' && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"
          wait-for-processing: true

      - name: Display Trivy summary
        if: always()
        run: |
          {
            echo "## 🔍 Trivy Security Scan Results"
            if [ -f "trivy-results.sarif" ] && [ -s "trivy-results.sarif" ]; then
              echo "✅ Scan completed. Results uploaded to GitHub Security tab."
              echo ""
              echo "**Note:** Check the Security tab for detailed vulnerability information."
            else
              echo "⚠️  Scan completed but no results file was generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group lint

      - name: Run Bandit security scan
        id: bandit-scan
        continue-on-error: true
        run: |
          if [ ! -d "src" ]; then
            echo "⚠️  Warning: src/ directory not found. Skipping Bandit scan."
            exit 0
          fi
          uv run --no-sync bandit -r src/ --severity-level medium --confidence-level medium -c pyproject.toml -f json -o bandit-report.json
          uv run --no-sync bandit -r src/ --severity-level medium --confidence-level medium -c pyproject.toml -f txt -o bandit-report.txt

      - name: Display Bandit results
        if: always()
        run: |
          {
            echo "## 🔒 Bandit Security Scan Results"

            if [ ! -f bandit-report.json ]; then
              if [ -d "src" ]; then
                echo "✅ Bandit scan completed with no issues found"
              else
                echo "⚠️  Skipped: src/ directory not found"
              fi
              exit 0
            fi

            if command -v jq &> /dev/null; then
              HIGH=$(jq -r '.metrics._totals.HIGH // 0' bandit-report.json 2>/dev/null || echo "0")
              MEDIUM=$(jq -r '.metrics._totals.MEDIUM // 0' bandit-report.json 2>/dev/null || echo "0")
              LOW=$(jq -r '.metrics._totals.LOW // 0' bandit-report.json 2>/dev/null || echo "0")
              TOTAL=$((HIGH + MEDIUM + LOW))

              echo "### Summary"
              echo "- **Total Issues**: $TOTAL"
              echo "- **High Severity**: $HIGH"
              echo "- **Medium Severity**: $MEDIUM"
              echo "- **Low Severity**: $LOW"
              echo ""

              if [ "$TOTAL" -gt 0 ]; then
                echo "### Detailed Report"
                echo '```'
                if [ -f bandit-report.txt ]; then
                  head -n 100 bandit-report.txt
                else
                  echo "Check JSON report for details."
                fi
                echo '```'
              else
                echo "✅ No security issues found!"
              fi
            else
              echo "⚠️  jq not available. Showing raw report:"
              if [ -f bandit-report.txt ]; then
                head -n 50 bandit-report.txt
              else
                echo "Check JSON report for details."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
