---
name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: ${{ runner.os }}-pip-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pipenv
        env:
          PIP_CACHE_DIR: .pip-cache
        run: |
          pip install --upgrade pip pipenv --root-user-action=ignore --cache-dir="$PIP_CACHE_DIR"

      - name: Install dependencies
        env:
          PIP_CACHE_DIR: .pip-cache
        run: |
          pipenv install --system --dev --deploy

      - name: Run tests with coverage
        run: |
          pipenv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing --cov-report=json -v

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(python -c "import json; data = json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.2f}\")")
          ROUNDED=$(python -c "coverage = float('$COVERAGE'); rounded = round(coverage / 5) * 5; rounded = int(min(100, max(0, rounded))); print(rounded)")
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "rounded=$ROUNDED" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COVERAGE% (rounded to $ROUNDED% for badge)"

      - name: Update README with coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          ROUNDED=${{ steps.coverage.outputs.rounded }}
          sed -i "s|coverage-100\.svg|coverage-${ROUNDED}.svg|g" README.md
          echo "Updated README to use coverage-${ROUNDED}.svg"

      - name: Commit and push README with updated coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit. README is already up to date."
          else
            git commit -m "Update coverage badge to ${{ steps.coverage.outputs.coverage }}% (rounded to ${{ steps.coverage.outputs.rounded }}%)"
            git push
          fi
