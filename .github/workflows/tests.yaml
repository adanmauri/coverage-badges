---
name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests with coverage
        run: uv run --no-sync pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Publish coverage badge
        uses: ./
        with:
          report: coverage.xml

  action-compatibility:
    # Runs the badge generator with the runner's system Python (3.10 on Ubuntu 22.04),
    # the oldest interpreter the action supports, without installing anything.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate a badge from every fixture format
        run: |
          python3 --version
          for report in tests/fixtures/*; do
            coverage=$(python3 -m src.generate_badge --report "$report" --output "$RUNNER_TEMP/badge.svg")
            echo "$report: $coverage%"
            test "$coverage" = "75.0"
          done
