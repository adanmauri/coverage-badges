---
name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Pull requests that change none of these skip the tests; main always runs them, and
    # publishes the badge (docs/adr/0008).
    paths:
      - "action.yml"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # The credentials stay: the badge step pushes with them on main.
      - name: Checkout code # zizmor: ignore[artipacked]
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests with coverage
        run: uv run --no-sync pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Publish coverage badge
        uses: ./
        with:
          report: coverage.xml

  action-compatibility:
    # Runs the badge generator with the runner's system Python (3.10 on Ubuntu 22.04),
    # the oldest interpreter the action supports, without installing anything.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Generate a badge from every fixture format
        run: |
          python3 --version
          for report in tests/fixtures/*; do
            coverage=$(python3 -m src.generate_badge --report "$report" --output "$RUNNER_TEMP/badge.svg")
            echo "$report: $coverage%"
            test "$coverage" = "75.0"
          done
