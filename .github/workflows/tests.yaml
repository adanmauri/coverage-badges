---
name: Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: ${{ runner.os }}-pip-${{ hashFiles('Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pipenv
        env:
          PIP_CACHE_DIR: .pip-cache
        run: |
          pip install --upgrade pip pipenv --root-user-action=ignore --cache-dir="$PIP_CACHE_DIR"

      - name: Install dependencies
        env:
          PIP_CACHE_DIR: .pip-cache
        run: |
          pipenv install --system --dev --deploy

      - name: Run tests with coverage
        run: |
          pipenv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Publish coverage badge
        uses: ./
        with:
          report: coverage.xml

  action-compatibility:
    # Runs the badge generator with the runner's system Python (3.10 on Ubuntu 22.04),
    # the oldest interpreter the action supports, without installing anything.
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate a badge from every fixture format
        run: |
          python3 --version
          for report in tests/fixtures/*; do
            coverage=$(python3 -m src.generate_badge --report "$report" --output "$RUNNER_TEMP/badge.svg")
            echo "$report: $coverage%"
            test "$coverage" = "75.0"
          done
